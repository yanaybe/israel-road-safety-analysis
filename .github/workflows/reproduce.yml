name: reproduce
on: [push, pull_request]
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the dashboard to gh-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt
      # data/raw is committed (CBS open licence), because data.gov.il blocks many cloud IPs.
      - run: python analysis/run_analysis.py
      - name: Committed results match a fresh run
        run: git diff --exit-code -- analysis/findings.md analysis/aggregates docs/index.html
      - run: python -m pytest -q
      - name: Publish the dashboard to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
